          <main style={{flex:1,height:'100%',overflowY:'auto',overflowX:'hidden',padding:'20px 16px',paddingBottom:'88px'}} className="scroll-area">
            <style>{`@media(min-width:768px){main{padding:28px 32px;padding-bottom:28px!important}}`}</style>

            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}} className="mob-header">
              <style>{`.mob-header{display:flex}@media(min-width:768px){.mob-header{display:none}}`}</style>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <I n="near_me" fill style={{color:'var(--amber)',fontSize:'1.2rem'}}/>
                <span className="font-display" style={{fontSize:'1.15rem',fontWeight:800,letterSpacing:'0.02em'}}>MotoTracker</span>
              </div>
              <div style={{display:'flex',gap:6}}>
                {isConnected && <span style={{width:7,height:7,borderRadius:'50%',background:'var(--green)',display:'inline-block',alignSelf:'center',animation:'pulse 2s infinite'}}></span>}
                <button className="iconbtn" style={{width:36,height:36}} onClick={()=>setTheme(t=>t==='dark'?'light':'dark')}>
                  <I n={isDark?'light_mode':'dark_mode'} xs/>
                </button>
              </div>
            </div>

            {loading ? (
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'40vh',gap:12,color:'var(--text3)'}}>
                <I n="near_me" xl fill style={{color:'var(--amber)',animation:'pulse 1.5s infinite'}}/>
                <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'1.1rem',fontWeight:700,letterSpacing:'0.05em',textTransform:'uppercase'}}>Conectando...</span>
              </div>
            ) : (
              <>
                {view==='dashboard' && <Dashboard/>}
                {view==='map' && <MapView/>}
                {view==='list' && <PlacesList/>}
                {view==='finance' && <FinanceView/>}
                {view==='checklist' && <ChecklistView/>}
                {view==='settings' && <SettingsView/>}
              </>
            )}
          </main>

          <nav className="mobile-nav" style={{position:'fixed',bottom:0,left:0,right:0,background:'var(--bg2)',borderTop:'1px solid var(--border)',padding:'6px 4px',paddingBottom:'max(6px, env(safe-area-inset-bottom))',display:'flex',alignItems:'center',zIndex:50,gap:2}}>
            {NAV.map(n=>(
              <div key={n.v} className={`mob-nav-item ${view===n.v?'active':''}`} onClick={()=>setView(n.v)}>
                <I n={n.icon} sm/>
                <span className="label">{n.label}</span>
              </div>
            ))}
            <div className={`mob-nav-item ${view==='settings'?'active':''}`} onClick={()=>setView('settings')}>
              <I n="settings" sm/>
              <span className="label">Config.</span>
            </div>
          </nav>

          {view==='list' && (
            <button className="mob-fab" onClick={()=>setAddModal(true)} style={{position:'fixed',bottom:80,right:16,background:'var(--amber)',color:'#000',border:'none',borderRadius:'50%',width:54,height:54,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 20px rgba(245,158,11,0.35)',cursor:'pointer',zIndex:49}}>
              <style>{`.mob-fab{display:flex}@media(min-width:768px){.mob-fab{display:none}}`}</style>
              <I n="add" lg/>
            </button>
          )}

          {addModal && <AddModal/>}
          {finishModal.open && <FinishModal/>}
          {expenseModal && <ExpenseModal/>}

          {toast && (
            <div className="toast" style={{borderColor:toast.isError?'rgba(239,68,68,0.3)':'var(--border-strong)'}}>
              <I n={toast.isError?'error':'check_circle'} sm style={{color:toast.isError?'var(--red)':'var(--green)'}}/>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
